<div class="options-container">
    <div class="actions">
        <button
            class="toggle icon-button round-button"
            (click)="visible = !visible"
        >
            @let icon = visible ? 'forward' : 'back';
            <i class="mi mi-arrow-{{icon}}"></i>
        </button>
    </div>

    <div
        class="options"
        [style.width]="visible ? 'auto' : 0"
    >
        <div class="lang-option-container">
            <div>{{'UI.OPTIONS.LANG' | translate}}</div>

            <div class="language-options">
                @for(lang of langs; track lang) {
                    <button
                        [ngClass]="{ selected: currentLang === lang}"
                        (click)="onChooseOutputLang(lang)"
                    >
                        {{lang}}
                    </button>
                }
            </div>
        </div>

        <div class="lang-option-container">
            <div>{{'UI.OPTIONS.SOURCE' | translate}}</div>

            <div class="language-options">
                @for(lang of langs; track lang) {
                    <button
                        [ngClass]="{ selected: svcData.sourceLang === lang}"
                        (click)="onChooseSourceLang(lang)"
                    >
                        {{lang}}
                    </button>
                }
            </div>
        </div>

        <div class="lang-option-container">
            <div>{{'UI.OPTIONS.TARGET' | translate}}</div>

            <div class="language-options">
                @for(lang of langs; track lang) {
                    @if(lang !== svcData.sourceLang) {
                        <button
                            [ngClass]="{ selected: svcData.targetLang === lang}"
                            (click)="onChooseTargetLang(lang)"
                        >
                            {{lang}}
                        </button>
                    }
                }
            </div>
        </div>
    </div>
</div>
