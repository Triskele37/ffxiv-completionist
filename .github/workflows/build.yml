name: Build App

on:
    push:
        tags:
            - "v*.*.*"  # Run only on version tags (e.g., v1.0.0)
    workflow_dispatch:  # Allow manual triggers

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install Dependencies
              run: npm install

            - name: Build
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  case "${{ matrix.os }}" in
                    macos-latest) npm run electron:build-mac ;;
                    ubuntu-latest) npm run electron:build-linux ;;
                    windows-latest) npm run electron:build ;;
                  esac

            - name: Upload Artifacts
              uses: actions/upload-artifact@v3
              with:
                  name: FFXIV-Completionist-${{ matrix.os }}
                  path: release/
