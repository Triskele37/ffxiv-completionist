<div class="group-search-results-header">
    @if(hasResults) {
        <!-- TODO - what was this? -->
        <p-button-group></p-button-group>
    }
</div>

@if(hasResults) {
    <div class="group-search-results-table">
        <p-table
            [value]="svcSearch.searchGroupMatches()"
            [scrollable]="true"
            class="p-datatable-striped"
            scrollHeight="flex"
            dataKey="fullStorageKey"
        >
            <ng-template #header>
                <tr>
                    <th>{{'APP.SEARCH.LINK' | translate}}</th>
                </tr>
            </ng-template>
            <ng-template #body let-match>
                <tr>
                    <td>
                        <com-content-link [content]="match.group"></com-content-link>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
} @else {
    <span>{{'APP.SEARCH.NO_RESULTS' | translate}}</span>
}
