<th
    data-active-help="APP.ACTIVE_HELP.TABLE.GROUP_ACTIONS"
    class="actions-cell noSelect"
>
    <div class="content-container">
        @if(expanded()) {
            <div
                class="actions-container"
                animate.enter="fade-in"
                animate.leave="fade-out"
            >
                <div class="actions noSelect">
                    @if(svcTable.groupRows) {
                        <com-expand-all-action></com-expand-all-action>
                        <com-collapse-all-action></com-collapse-all-action>
                    }

                    @if(isDev()) {
                        <com-copy-data-action [resolveLinks]="false"></com-copy-data-action>
                        <com-copy-data-action [resolveLinks]="true"></com-copy-data-action>
                    }

                    @if(svcTable.group().type === 'Data') {
                        <com-edit-note-action
                            [group]="svcTable.group()"
                        ></com-edit-note-action>
                    }

                    @if(svcTable.group().type === 'Data') {
                        <com-bookmark-group-action
                            (clicked)="onCloseActions()"
                        ></com-bookmark-group-action>
                    }

                    <span>
                        <button
                            pButton
                            class="action close-dial"
                            (click)="onDialClick()"
                        >
                        </button>
                    </span>
                </div>
            </div>
        }

        <!-- Must come after .actions-container + selector styling -->
        <button
            pButton
            class="action-dial p-button-text p-button-rounded p-button-plain p-mr-2"
            [ngClass]="{ 'with-actions': expanded() }"
            [pTooltip]="expanded() ? '' : ('APP.TABLE.GROUP_ACTION.TITLE' | translate)"
            tooltipPosition="left"
            (click)="onDialClick()"
        >
            @if(expanded()) {
                <ng-icon name="matKeyboardArrowRight"></ng-icon>
            }
            @else {
                <ng-icon name="matKeyboardArrowLeft"></ng-icon>
            }
        </button>
    </div>
</th>
