@if(isBookmarked()) {
    <ng-icon
        name="matBookmarkRemove"
        class="action"
        [pTooltip]="'APP.TABLE.ROW_ACTION.UNBOOKMARK' | translate"
        tooltipPosition="top"
        (click)="toggleBookmark()"
    ></ng-icon>
} @else {
    <ng-icon
        name="matBookmarkAdd"
        class="action"
        [pTooltip]="'APP.TABLE.ROW_ACTION.BOOKMARK' | translate"
        tooltipPosition="top"
        (click)="toggleBookmark()"
    ></ng-icon>
}
