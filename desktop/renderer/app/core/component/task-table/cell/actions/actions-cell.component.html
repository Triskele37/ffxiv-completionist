<td
    data-active-help="APP.ACTIVE_HELP.TABLE.ROW_ACTIONS"
    class="actions-cell noSelect"
>
    <div class="content-container">
        @if(expanded()) {
            <div
                class="actions-container"
                animate.enter="fade-in"
                animate.leave="fade-out"
            >
                <div class="actions noSelect">
                    @for(taskLink of taskLinks; track $index) {
                        <com-task-link-action
                            [taskLink]="taskLink"
                            [task]="task"
                            (clicked)="onCloseActions()"
                        ></com-task-link-action>
                    }

                    @if(showCopyId()) {
                        <com-copy-id-action
                            [task]="task"
                        ></com-copy-id-action>
                    }

                    @if(svcTable.group().type !== 'Custom') {
                        <com-view-chains-action
                            [task]="task"
                        ></com-view-chains-action>
                    }

                    @if(svcTable.group().type !== 'Note') {
                        <com-edit-note-action
                            [task]="task"
                        ></com-edit-note-action>
                    }

                    @if(svcTable.group().type !== 'Custom') {
                        <com-bookmark-action
                            [task]="task"
                            (clicked)="onCloseActions()"
                        ></com-bookmark-action>
                    }

                    @if(svcTable.group().draggable) {
                        <com-drag-action
                            [rowIndex]="rowIndex"
                        ></com-drag-action>
                    }

                    <span>
                        <button
                            pButton
                            class="action close-dial"
                            (click)="onDialClick()"
                        >
                        </button>
                    </span>
                </div>
            </div>
        }

        <!-- Must come after .actions-container + selector styling -->
        <button
            pButton
            class="action-dial p-button-text p-button-rounded p-button-plain p-mr-2"
            [ngClass]="{ 'with-actions': expanded() }"
            [pTooltip]="expanded() ? '' : ('APP.TABLE.ROW_ACTION.TITLE' | translate)"
            tooltipPosition="left"
            (click)="onDialClick()"
        >
            @if(expanded()) {
                <ng-icon name="matKeyboardArrowRight"></ng-icon>
            }
            @else {
                <ng-icon name="matKeyboardArrowLeft"></ng-icon>
            }
        </button>
    </div>
</td>
