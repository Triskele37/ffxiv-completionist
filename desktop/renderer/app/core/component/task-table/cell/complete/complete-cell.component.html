@if(task.isNumericCompletion) {
    <com-numeric-complete-cell
        [task]="task"
        [value]="task.completionFlag$()"
        [rowSpan]="rowSpan"
    ></com-numeric-complete-cell>
} @else {
    <com-flag-complete-cell
        [task]="task"
        [rowSpan]="rowSpan"
    ></com-flag-complete-cell>
}
