<span
    class="cell-value"
    [ngClass]="{ 'text-only': value.type === 'Value', link: value.type !== 'Value' }"
    [pTooltip]="tooltip()"
    tooltipPosition="bottom"
>
    @if(value.type === 'Value') {
        <span>{{value.value}}</span>
    }
    @else {
        <!-- Content links to other content -->
        @if(value.pre) {
            <span>{{value.pre}}</span>
        }

        @if(value.type === 'Group') {
            <com-content-link
                [content]="value.value"
                [trimGroup]="column.trimGroup ? svcTable.group() : undefined"
            ></com-content-link>
        }
        @else if(value.type === 'Task') {
            <com-content-link
                [content]="value.value"
                [nameOnly]="true"
            ></com-content-link>
        }

        @if(value.post) {
            <span>{{value.post}}</span>
        }
    }
</span>
