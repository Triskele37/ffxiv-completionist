@if(isShowAllVisible()) {
    @let enabled = svcNavigation.allTaskViewEnabled();
    <button
        data-active-help="APP.ACTIVE_HELP.NAV_BAR.SHOW_ALL_TOGGLE"
        pButton
        tooltipPosition="bottom"
        [pTooltip]="(enabled ? 'APP.TABLE.HIDE_ALL' : 'APP.TABLE.SHOW_ALL') | translate"
        (click)="emitShowAllChange(!enabled)"
    >
        @let icon = enabled ? 'mi-close-fullscreen' : 'mi-open-in-full';
        <span class="mi {{icon}}"></span>
    </button>
}
