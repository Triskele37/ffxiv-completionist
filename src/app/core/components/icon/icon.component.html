<span
    class="icon-container"
    [ngClass]="name"
    [style.fontSize]="size + 'px'"
>
    <span *ngIf="name === 'selected'">&#9755;</span>
    <span *ngIf="name === 'complete'">&#10004;</span>
    <span *ngIf="name === 'exclude'">&#10006;</span>
    <span *ngIf="name === 'incomplete'">&#10008;</span>
    <span *ngIf="name === 'plus'">&#10010;</span>
    <span *ngIf="name === 'arrow'">&#10147;</span>
    <span *ngIf="name === 'chain'">&#9939;</span>
</span>
