<span
    class="overlay-container"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
>
    <p-button
        styleClass="p-button-outlined"
        icon="material-icons mi-touch-app"
    ></p-button>

    <div *ngIf="isVisible" class="overlay-panel">
        <span class="content">
            <p-button
                [label]="'OVERLAY.SELECTION.TITLE' | translate"
                [disabled]="true"
            ></p-button>

            <p-button
                [label]="'OVERLAY.SELECTION.SELECT_ALL' | translate"
                (onClick)="onSelectChange(true)"
            ></p-button>
            <p-button
                [label]="'OVERLAY.SELECTION.DESELECT_ALL' | translate"
                (onClick)="onSelectChange(false)"
            ></p-button>
            <p-button
                [label]="'OVERLAY.SELECTION.INVERT' | translate"
                (onClick)="onSelectChange(null)"
            ></p-button>

            <ng-container *ngIf="group.isCraftingLogGroup">
                <p-divider align="center">
                    {{'OVERLAY.SELECTION.ACTIONS' | translate}}
                </p-divider>

                <p-button
                    [label]="'OVERLAY.SELECTION.GARLAND' | translate"
                    (onClick)="openInGarland()"
                ></p-button>

                <p-button
                    [label]="'OVERLAY.SELECTION.TEAMCRAFT' | translate"
                    (onClick)="openInTeamcraft()"
                ></p-button>
            </ng-container>
        </span>
    </div>
</span>
