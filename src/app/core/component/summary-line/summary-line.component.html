<div
    class="summary-line"
    [ngClass]="{ big: isBig, excluded: percentComplete === 'N/A'}"
    [title]="tooltip"
    (click)="onClick()"
>
    <template *ngIf="isBig; else normalSize">
        <span class="summary-info big">
            {{group.name}}
            <br />
            {{percentComplete}}
        </span>
    </template>
    <template #normalSize>
        <span class="summary-info">
            <span>{{group.name}}</span>
            <span style="float: right;">
                {{percentComplete}}
            </span>
        </span>
    </template>
    <span class="progress-line" [style]="completeBarStyle"></span>
</div>
