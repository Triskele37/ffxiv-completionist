<span
    class="overlay-container"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
>
    <p-button
        styleClass="p-button-outlined"
        icon="material-icons mi-rule"
    ></p-button>

    <div *ngIf="isVisible" class="overlay-panel">
        <span class="content">
            <p-button label="Quick-Mark Menu" [disabled]="true"></p-button>

            <p-button (click)="onChangeTaskCompletion(N, Y)">
                (<i class="i-incomplete"></i> <i class="i-arrow"></i> <i class="i-complete"></i>)
                Mark Incomplete as Complete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(N, X)">
                (<i class="i-incomplete"></i> <i class="i-arrow"></i> <i class="i-exclude"></i>)
                Mark Incomplete as Excluded
            </p-button>

            <p-button (click)="onChangeTaskCompletion(Y, N)">
                (<i class="i-complete"></i> <i class="i-arrow"></i> <i class="i-incomplete"></i>)
                Mark Complete as Incomplete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(Y, X)">
                (<i class="i-complete"></i> <i class="i-arrow"></i> <i class="i-exclude"></i>)
                Mark Complete as Excluded
            </p-button>

            <p-button (click)="onChangeTaskCompletion(X, N)">
                (<i class="i-exclude"></i> <i class="i-arrow"></i> <i class="i-incomplete"></i>)
                Mark Excluded as Incomplete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(X, Y)">
                (<i class="i-exclude"></i> <i class="i-arrow"></i> <i class="i-complete"></i>)
                Mark Excluded as Complete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(null, Y)">
                (<i class="i-selected"></i> <i class="i-arrow"></i> <i class="i-complete"></i>)
                Mark Selected as Complete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(null, N)">
                (<i class="i-selected"></i> <i class="i-arrow"></i> <i class="i-incomplete"></i>)
                Mark Selected as Incomplete
            </p-button>

            <p-button (click)="onChangeTaskCompletion(null, X)">
                (<i class="i-selected"></i> <i class="i-arrow"></i> <i class="i-exclude"></i>)
                Mark Selected as Excluded
            </p-button>

            <p-button
                *ngIf="history.length"
                label="Undo Last Quick-Mark"
                (onClick)="onUndoLastChange()"
            ></p-button>
        </span>
    </div>
</span>
