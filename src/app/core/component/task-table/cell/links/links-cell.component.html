<div class="links-cell">
    <ng-container *ngTemplateOutlet="tasks.length < 2 ? singleValue : multiValue"></ng-container>
</div>

<!-- One Value -->
<ng-template #singleValue>
    <ng-container
        *ngTemplateOutlet="!tasks[0]?.completionFlag ? text : link; context: { $implicit: tasks[0] }"
    ></ng-container>
</ng-template>

<!-- Multiple Values, use button & overlay -->
<ng-template #multiValue>
    <p-button
        class="noSelect"
        styleClass="p-button-link"
        label="{{'TABLE.VIEW_LINKS' | translate}} ({{tasks.length}})"
        (mouseenter)="linkOverlay.show($event)"
        (mouseleave)="onMultiLinkLeave()"
        (onClick)="onLockOverlayClick()"
    ></p-button>

    <p-overlayPanel
        #linkOverlay
        styleClass="link-overlay"
    >
        <ng-template pTemplate="content">
            <div
                class="overlay-container"
                (mouseleave)="onOverlayLeave()"
            >
                <ng-container *ngFor="let task of tasks">
                    <ng-container
                        *ngTemplateOutlet="!task?.completionFlag ? text : link; context: { $implicit: task }"
                    ></ng-container>
                </ng-container>
            </div>
        </ng-template>
    </p-overlayPanel>
</ng-template>

<!-- Raw Text -->
<ng-template #text let-task>
    <xiv-data-cell [value]="task"></xiv-data-cell>
</ng-template>

<!-- Task Link -->
<ng-template #link let-task>
    <p-button
        class="content-link noSelect"
        styleClass="p-button-link"
        tooltipPosition="left"
        [pTooltip]="
            (task._parent | contentLink) + '\n' +
            ('GENERAL.TASK_NAVIGATE' | translate)
        "
        [label]="task | contentLink"
        (onClick)="onClickLink(task)"
    ></p-button>
</ng-template>
