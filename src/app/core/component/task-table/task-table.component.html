<div *ngIf="!!columnConfig" class="task-table-container">
    <div class="task-table-toolbar">
        <span class="p-buttonset">
            <xiv-quick-mark-dropdown
                *ngIf="hasTasks && !group.isNumericCompletion"
                [filteredTasks]="filteredTasks"
            ></xiv-quick-mark-dropdown>

            <xiv-select-dropdown
                *ngIf="hasTasks && !group.isNumericCompletion"
                [group]="group"
                [filteredTasks]="filteredTasks"
                (selectChange)="onSelectChange()"
            ></xiv-select-dropdown>

            <xiv-chain-dropdown
                *ngIf="hasTasks"
                [disableUndo]="group.isCustomGroup"
            ></xiv-chain-dropdown>

            <xiv-custom-task-dropdown
                *ngIf="group.isCustomGroup"
                [filteredTasks]="filteredTasks"
            ></xiv-custom-task-dropdown>
        </span>

        <span
            *ngIf="hasTasks"
            class="row-count"
            tooltipPosition="top"
            [pTooltip]="(totalTasks - displayedTasks) + ' Hidden'"
        >
            {{displayedTasks}} Rows displayed
        </span>
    </div>

    <div class="task-table-scroll-container">
        <p-table
            *ngIf="hasTasks"
            styleClass="p-datatable-striped"
            [value]="filteredTasksArr"
        >
            <ng-template pTemplate="header">
                <xiv-header-row
                    [columnConfig]="columnConfig"
                    [uniqueValues]="uniqueValues"
                    [isNumericCompletion]="group.isNumericCompletion"
                    (filterChange)="onFilterChange($event)"
                ></xiv-header-row>
            </ng-template>
            <ng-template pTemplate="body" let-task>
                <xiv-data-row
                    [columnConfig]="columnConfig"
                    [enableDrag]="group.draggable"
                    [task]="task"
                    (completionChange)="updateFilteredTasks()"
                ></xiv-data-row>
            </ng-template>
        </p-table>
    </div>
</div>
