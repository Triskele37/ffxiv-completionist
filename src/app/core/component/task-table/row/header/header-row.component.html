<tr class="task-table-header">
    <!-- Completion Header -->
    <ng-container *ngIf="!group.isNumericCompletion; else numericColumn">
        <th class="completion-column">
            <i
                class="i-complete"
                [ngClass]="{ enabled: filters.completion.completed }"
                (click)="onFilterCompletion(Completion.Y)"
            ></i>

            <i
                class="i-incomplete"
                [ngClass]="{ enabled: filters.completion.incomplete }"
                (click)="onFilterCompletion(Completion.N)"
            ></i>

            <br/>

            <i
                class="i-exclude"
                [ngClass]="{ enabled: filters.completion.excluded }"
                (click)="onFilterCompletion(Completion.X)"
            ></i>
        </th>
    </ng-container>
    <ng-template #numericColumn>
        <th class="completion-column numeric">#</th>
    </ng-template>

    <!-- Data Headers -->
    <th
        *ngFor="let column of group.columns"
        [style.width.px]="column.width"
    >
        <div
            class="column-name"
            [pSortableColumn]="column.key"
            [pSortableColumnDisabled]="group.isCustomGroup"
        >
            {{column.header}}
            <p-sortIcon
                *ngIf="!group.isCustomGroup"
                [field]="column.key"
            ></p-sortIcon>
        </div>
        <div class="column-filter">
            <ng-container *ngIf="column.filterable; else inputFilter">
                <p-dropdown
                    styleClass="dropdown-filter"
                    [editable]="true"
                    [options]="uniqueValues[column.key]"
                    [showClear]="true"
                    appendTo="body"
                    (keyup)="onFilterKeyup($event, column)"
                    (onChange)="onFilterDropdownChange($event, column)"
                >
                    <ng-template pTemplate="item" let-item>
                        {{displayedFilterValue(item)}}
                    </ng-template>
                </p-dropdown>
            </ng-container>

            <ng-template #inputFilter>
                <input
                    class="text-filter"
                    pInputText
                    [value]="filters[column.key]?.value"
                    (keyup)="onFilterKeyup($event, column)"
                />
                <i
                    *ngIf="filters[column.key]?.value"
                    class="pi pi-times"
                    (click)="modifySearch('', column)"
                ></i>
            </ng-template>
        </div>
    </th>

    <!-- Row Action Header -->
    <th></th>
</tr>
