<tr class="task-table-header">
    <th class="completion-column">
        <ng-container *ngIf="!isNumericCompletion; else numericColumn">
            <span (click)="onFilterCompletion('Y')">
                <xiv-icon
                    [ngClass]="{ enabledFilter: filters.completion.completed }"
                    name="complete"
                ></xiv-icon>
            </span>
            <span (click)="onFilterCompletion('N')">
                <xiv-icon
                    [ngClass]="{ enabledFilter: filters.completion.incomplete }"
                    name="incomplete"
                ></xiv-icon>
            </span>
            <br/>
            <span (click)="onFilterCompletion('X')">
                <xiv-icon
                    [ngClass]="{ enabledFilter: filters.completion.excluded }"
                    name="exclude"
                ></xiv-icon>
            </span>
        </ng-container>
        <ng-template #numericColumn>
            #
        </ng-template>
    </th>

    <th *ngFor="let column of columnConfig">
        <div class="column-search">
            <input
                (keyup)="modifySearch($event, column)"
                (search)="modifySearch($event, column)"
                (keydown)="onDatalistClick($event)"
                placeholder="..."
                class="xiv-combo"
                type="search"
            />
<!--            [list]="column.key"-->
            <datalist [id]="column.key" *ngIf="column.filterable">
                <option>Blank</option>
                <option
                    *ngFor="let uniqueValue of uniqueValues[column.key]"
                >
                    {{displayedFilterValue(uniqueValue)}}
                </option>
            </datalist>
        </div>
        <div>
            {{column.header}}
        </div>
    </th>

    <th></th>
</tr>
