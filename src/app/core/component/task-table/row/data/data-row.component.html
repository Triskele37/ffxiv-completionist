<tr
    [pReorderableRow]="rowIndex"
    [pReorderableRowDisabled]="!dragEnabled"
    [ngClass]="{
        selected: task.selected
    }"
    (click)="onClick($event)"
>
    <ng-container *ngIf="!task.isNumericCompletion; else numericCell">
        <xiv-complete-cell
            [task]="task"
            [flag]="task.completionFlag"
            (onChange)="completionChange.emit()"
        ></xiv-complete-cell>
    </ng-container>
    <ng-template #numericCell>
        <xiv-numeric-complete-cell
            [task]="task"
            [value]="task.completionFlag"
        ></xiv-numeric-complete-cell>
    </ng-template>

    <td
        class="data-cell"
        *ngFor="let column of columns"
        [ngClass]="{ centered: column.centered }"
    >
        <xiv-edit-cell
            *ngIf="column.editable; else linkCell"
            [task]="task"
            [key]="column.key"
        ></xiv-edit-cell>

        <ng-template #linkCell>
            <xiv-link-cell
                *ngIf="column.key === 'groupLink'; else staticCell"
                [task]="task"
            ></xiv-link-cell>
        </ng-template>

        <ng-template #staticCell>
            {{task[column.key]}}
        </ng-template>
    </td>

    <xiv-actions-cell
        [task]="task"
        [rowIndex]="rowIndex"
    ></xiv-actions-cell>
</tr>
