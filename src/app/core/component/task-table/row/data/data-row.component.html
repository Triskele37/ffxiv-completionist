<tr
    [draggable]="enableDrag && !debounceDrag"
    [ngClass]="{
        selected: !!task.selected,
        dropTarget: !!task.dropTarget
    }"
    (click)="onClick($event)"
    (dragstart)="enableDrag && onRowDragStart()"
    (dragover)="enableDrag && onRowDragOver($event)"
    (dragleave)="enableDrag && onRowDragLeave($event)"
    (drop)="enableDrag && onDragDrop()"
>
    <ng-container *ngIf="!task.isNumericCompletion; else numericCell">
        <xiv-complete-cell
            [task]="task"
            [flag]="task.completionFlag"
            (onChange)="completionChange.emit()"
        ></xiv-complete-cell>
    </ng-container>
    <ng-template #numericCell>
        <xiv-numeric-complete-cell
            [task]="task"
            [value]="task.completionFlag"
        ></xiv-numeric-complete-cell>
    </ng-template>

    <td
        class="data-cell"
        *ngFor="let column of columnConfig"
        [ngClass]="{ centered: !!column.centered }"
    >
        <ng-container *ngIf="column.editable && task.selected; else staticCell">
            <xiv-edit-cell
                [taskKey]="column.key"
                [task]="task"
                (deselectTask)="onDeselectTask(task)"
            ></xiv-edit-cell>
        </ng-container>
        <ng-template #staticCell>
            {{task[column.key]}}
        </ng-template>
    </td>

    <xiv-actions-cell
        [task]="task"
    ></xiv-actions-cell>
</tr>
