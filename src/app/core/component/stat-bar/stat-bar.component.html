<div #statBar class="stat-bar">
    <xiv-summary-line
        *ngIf="!hideOverall"
        [group]="allData"
        [isBig]="true"
    ></xiv-summary-line>

    <xiv-summary-line
        *ngIf="!hideGroup && group?._parent && !group?.isUiGroup"
        [group]="group"
        [isBig]="true"
    ></xiv-summary-line>

    <p-contextMenu
        *ngIf="!!this.group?._parent"
        [target]="statBar"
        [model]="contextMenuItems"
    ></p-contextMenu>
</div>
