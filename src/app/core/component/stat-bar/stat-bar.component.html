<div #statBar class="stat-bar">
    <xiv-summary-line
        [group]="allData"
        [isBig]="true"
    ></xiv-summary-line>

    <xiv-summary-line
        *ngIf="!hideGroupLine && group?._parent"
        [group]="group"
        [isBig]="true"
    ></xiv-summary-line>

    <p-contextMenu
        [target]="statBar"
        [model]="contextMenuItems"
    ></p-contextMenu>
</div>
