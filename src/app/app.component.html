<div id="app">
    <div id="loading-modal" *ngIf="loading">
        {{modalText}}
    </div>

    <div class="left-container">
        <xiv-nav-drawer></xiv-nav-drawer>
        <xiv-search-bar></xiv-search-bar>
    </div>

    <div class="right-container">
        <xiv-stat-bar></xiv-stat-bar>
        <xiv-breadcrumbs (showAllChange)="onShowAllChange($event)"></xiv-breadcrumbs>

        <xiv-main-content [showAll]="showAll"></xiv-main-content>
    </div>
</div>
