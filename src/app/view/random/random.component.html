<div class="random">
    <p-button
        icon="mi mi-casino"
        (onClick)="onGenerateRandomClick()"
    ></p-button>

    <ng-container *ngFor="let task of randomTasks">
        <xiv-content-link
            [content]="task"
            [nameOnly]="true"
        ></xiv-content-link>
    </ng-container>
</div>
