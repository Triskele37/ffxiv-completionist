<div class="setting">
    <label>{{'MAIN.SETTING.THEME.PRESETS.TITLE' | translate}}:</label>
    <div class="p-buttonset">
        <p-button
            [label]="'MAIN.SETTING.THEME.PRESETS.DEFAULT' | translate"
            (onClick)="useDefaultTheme()"
        ></p-button>

        <p-button
            [label]="'MAIN.SETTING.THEME.PRESETS.DARK' | translate"
            (onClick)="useDarkTheme()"
        ></p-button>

        <p-button
            [label]="'MAIN.SETTING.THEME.PRESETS.LIGHT' | translate"
            (onClick)="useLightTheme()"
        ></p-button>

        <p-button
            [label]="'MAIN.SETTING.THEME.PRESETS.CLASSIC' | translate"
            (onClick)="useClassicTheme()"
        ></p-button>
    </div>
</div>

<div class="setting">
    <label>{{'MAIN.SETTING.THEME.PRIMARY_COLOR' | translate}}:</label>
    <p-colorPicker
        [(ngModel)]="primaryColor"
        (onChange)="setPrimaryColor(primaryColor)"
    ></p-colorPicker>
</div>

<div class="setting">
    <label>{{'MAIN.SETTING.THEME.PRIMARY_TEXT' | translate}}:</label>
    <p-colorPicker
        [(ngModel)]="primaryTextColor"
        (onChange)="setPrimaryTextColor(primaryTextColor)"
    ></p-colorPicker>
</div>

<div class="setting">
    <label>{{'MAIN.SETTING.THEME.BACKGROUND' | translate}}:</label>
    <p-colorPicker
        format="hsb"
        [(ngModel)]="backgroundColor"
        (onChange)="setBackgroundColor(backgroundColor)"
    ></p-colorPicker>
</div>

<div class="setting">
    <label>{{'MAIN.SETTING.THEME.TEXT_COLOR' | translate}}:</label>
    <p-colorPicker
        format="rgb"
        [(ngModel)]="textColor"
        (onChange)="setTextColor(textColor)"
    ></p-colorPicker>
</div>

<div class="setting">
    <label>{{'MAIN.SETTING.THEME.FONT' | translate}}:</label>
    <input
        pInputText
        [(ngModel)]="fontFamily"
        (change)="setFontFamily(fontFamily)"
    />
</div>
