<div *ngIf="isModalVisible" class="xiv-modal"></div>

<div class="setting">
    <label>Language:</label>
    <p-dropdown
        optionValue="short"
        optionLabel="long"
        [options]="languages"
        [(ngModel)]="settings.lang.value"
        (onChange)="onChangeLanguage()"
    ></p-dropdown>
</div>

<div class="setting starting-class">
    <span
        class="tooltip-container"
        pTooltip="Changing this value excludes innaccessible content"
        tooltipPosition="right"
    >
        <label>Starting Class:</label>
        <p-dropdown
            placeholder="Select Class"
            [options]="startingClasses"
            [(ngModel)]="settings.startingClass.value"
            (onChange)="onChangeStartingClass()"
        ></p-dropdown>
    </span>

    <xiv-chain-overlay [disableUndo]="true"></xiv-chain-overlay>
</div>

<div class="setting">
    <label>Save File Location:</label>
    <label>{{settings.storeLocation.value}}</label>
</div>

<div class="setting">
    <label>Save File Name:</label>
    <label>{{settings.storeName.value}}.json</label>
</div>

<div class="setting">
    <label>Change Save:</label>
    <span class="p-buttonset">
        <p-button
            label="Create New"
            (onClick)="onNewSaveClick()"
        ></p-button>
        <p-button
            label="Load Existing"
            (onClick)="onLoadSaveClick()"
        ></p-button>
    </span>
</div>

<div class="setting">
    <label>Open Folder:</label>
    <span class="p-buttonset">
        <p-button
            label="Config"
            (onClick)="onOpenConfigClick()"
        ></p-button>
        <p-button
            label="Save"
            (onClick)="onOpenSaveClick()"
        ></p-button>
        <p-button
            label="Both"
            (onClick)="onOpenBothClick()"
        ></p-button>
    </span>
</div>

<div class="setting">
    <label>Backup:</label>
    <span class="p-buttonset">
        <p-button
            label="Config"
            (onClick)="onBackupConfigClick()"
        ></p-button>
        <p-button
            label="Save"
            (onClick)="onBackupSaveClick()"
        ></p-button>
        <p-button
            label="Both"
            (onClick)="onBackupBothClick()"
        ></p-button>
    </span>
</div>
