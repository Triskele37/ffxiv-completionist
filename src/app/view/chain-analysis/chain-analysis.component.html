<div class="chain-analysis">
    <div class="header">
        <p-button
            class="refresh-button"
            icon="mi mi-refresh"
            (onClick)="analyzeChainedTasks()"
        ></p-button>

        {{issues.length}} {{'TABLE.DISPLAYED' | translate}}
    </div>

    <div class="issue-table">
        <p-table
            [value]="issues"
            [scrollable]="true"
            scrollHeight="flex"
            styleClass="p-datatable-striped"
        >
            <ng-template pTemplate="body" let-match>
                <tr>
                    <ng-container
                        *ngTemplateOutlet="completionCell; context: { $implicit: match.sourceTask }"
                    ></ng-container>
                    <td>
                        <xiv-content-link [content]="match.sourceTask"></xiv-content-link>
                    </td>
                    <td class="issue-description">
                        {{'MAIN.CHAIN_ANALYSIS.' + match.type | translate}}
                    </td>
                    <ng-container
                        *ngTemplateOutlet="completionCell; context: { $implicit: match.targetTask }"
                    ></ng-container>
                    <td>
                        <xiv-content-link [content]="match.targetTask"></xiv-content-link>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<ng-template #completionCell let-task>
    <ng-container *ngIf="!task.isNumericCompletion; else numericCell">
        <xiv-complete-cell
            [task]="task"
            [flag]="task.completionFlag"
        ></xiv-complete-cell>
    </ng-container>
    <ng-template #numericCell>
        <xiv-numeric-complete-cell
            [task]="task"
            [value]="task.completionFlag"
        ></xiv-numeric-complete-cell>
    </ng-template>
</ng-template>
