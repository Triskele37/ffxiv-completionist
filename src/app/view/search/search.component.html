<div class="search-data-container">
    <div
        *ngIf="(svcSearch.searchMatches$ | async).length; else noSearch"
        class="section-container"
    >
        <span class="p-buttonset">
            <button
                pButton
                label="{{willCollapseAll ? 'Collapse' : 'Expand'}} All"
                (click)="setRowsExpanded(svcSearch.searchMatches$.value, !willCollapseAll)"
            ></button>

            <button
                pButton
                [label]="svcSearch.expanded ? 'Search Name Columns' : 'Search All Columns'"
                (click)="expandSearch()"
            ></button>
        </span>

        <br/>

        <div>{{(svcSearch.searchMatches$ | async).length}} Match/es</div>
    </div>

    <ng-template #noSearch>
        <span>Please enter a search term</span>
    </ng-template>

    <div
        *ngIf="(svcSearch.searchStatus$ | async) === Status.Success"
        class="results"
    >
        <p-table
            [expandedRowKeys]="expandedRows"
            [value]="svcSearch.searchMatches$ | async"
            rowGroupMode="subheader"
            groupRowsBy="task._parent.fullStorageKey"
            dataKey="task._parent.fullStorageKey"
            styleClass="p-datatable-striped"
            (onRowCollapse)="evaluateToggleAll(true)"
            (onRowExpand)="evaluateToggleAll(false)"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th>Complete</th>
                    <th *ngIf="svcSearch.expanded">Column</th>
                    <th>Value</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="groupheader" let-match let-expanded="expanded">
                <tr pRowGroupHeader [pRowToggler]="match">
                    <td>
                        <p-button
                            styleClass="p-button-text p-button-rounded p-button-plain p-mr-2"
                            [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
                        ></p-button>
                    </td>
                    <td [colSpan]="svcSearch.expanded ? 2 : 1">
                        <xiv-link-cell [task]="match.task"></xiv-link-cell>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="rowexpansion" let-match>
                <tr class="result-row">
                    <ng-container *ngIf="!match.task.isNumericCompletion; else numericCell">
                        <xiv-complete-cell
                            [task]="match.task"
                            [flag]="match.task.completionFlag"
                        ></xiv-complete-cell>
                    </ng-container>
                    <ng-template #numericCell>
                        <xiv-numeric-complete-cell
                            [task]="match.task"
                            [value]="match.task.completionFlag"
                        ></xiv-numeric-complete-cell>
                    </ng-template>

                    <td *ngIf="svcSearch.expanded">{{match.header}}</td>
                    <td>{{match.task[match.key]}}</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
