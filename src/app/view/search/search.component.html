<div class="search-container">
    <ng-container *ngIf="svcSearch.searchError$ | async; else checkNoSearches">
        <span>{{svcSearch.searchError$ | async}}</span>
    </ng-container>

    <ng-template #checkNoSearches>
        <ng-container *ngIf="!taskMatches && !groupMatches">
            <span>{{'MAIN.SEARCH.NO_SEARCH' | translate}}</span>
        </ng-container>
    </ng-template>

    <ng-container *ngIf="(svcSearch.searchStatus$ | async) === Status.Success">
        <p-tabView [activeIndex]="taskMatches ? 0 : 1">
            <p-tabPanel header="{{'MAIN.SEARCH.TASK_TAB' | translate}} ({{taskMatches}})">
                <xiv-task-search-results></xiv-task-search-results>
            </p-tabPanel>
            <p-tabPanel header="{{'MAIN.SEARCH.GROUP_TAB' | translate}} ({{groupMatches}})">
                <xiv-group-search-results></xiv-group-search-results>
            </p-tabPanel>
        </p-tabView>
    </ng-container>
</div>
