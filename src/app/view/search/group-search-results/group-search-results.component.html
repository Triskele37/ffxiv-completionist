<div class="group-search-results-header">
    <span *ngIf="hasResults" class="p-buttonset">

    </span>
</div>

<div *ngIf="hasResults; else noResults" class="group-search-results-table">
    <p-table
        [value]="svcSearch.searchGroupMatches$ | async"
        [scrollable]="true"
        scrollHeight="flex"
        dataKey="fullStorageKey"
        styleClass="p-datatable-striped"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>{{'MAIN.SEARCH.LINK' | translate}}</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-match>
            <tr>
                <td>
                    <xiv-content-link [content]="match.group"></xiv-content-link>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<ng-template #noResults>
    <span>{{'MAIN.SEARCH.NO_RESULTS' | translate}}</span>
</ng-template>
